name: Build native PC builds

# Builds the 32-bit Windows and Linux Turbocharged executables, plus a 32-bit
# ARM (armhf) Linux build for the Raspberry Pi 5 (see docs/RASPBERRY_PI5.md).
# Packages contain no game assets: players must supply their own ctr-u.bin.

on:
  push:
    branches:
      - turbocharged
      - native-renderer
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux x86
    runs-on: ubuntu-latest
    # Build against Ubuntu 22.04's glibc so the binary runs on older distros too.
    container: ubuntu:22.04
    env:
      DEBIAN_FRONTEND: noninteractive
      PKG_CONFIG_LIBDIR: /usr/lib/i386-linux-gnu/pkgconfig:/usr/share/pkgconfig
    steps:
      - name: Install toolchain and 32-bit SDL dependencies
        run: |
          dpkg --add-architecture i386
          apt-get update
          apt-get install -y --no-install-recommends \
            git ca-certificates curl file binutils cmake ninja-build clang-tidy python3 pkg-config gcc-multilib libwayland-bin \
            libx11-dev:i386 libxext-dev:i386 libxcursor-dev:i386 libxi-dev:i386 \
            libxrandr-dev:i386 libxfixes-dev:i386 libgl-dev:i386 libegl-dev:i386 \
            libasound2-dev:i386 libpulse-dev:i386 libpipewire-0.3-dev:i386 \
            libjack-jackd2-dev:i386 libudev-dev:i386 libdbus-1-dev:i386 \
            libibus-1.0-dev:i386 libusb-1.0-0-dev:i386 libwayland-dev:i386 \
            libxkbcommon-dev:i386 libdecor-0-dev:i386 libdrm-dev:i386 libgbm-dev:i386 \
            xvfb libgl1-mesa-dri:i386 libgl1:i386

      - name: Checkout
        uses: actions/checkout@v6

      # The container runs as root on a runner-owned checkout; without this the
      # build ID that CMake reads from git becomes "unknown-dirty".
      - name: Trust workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON
          -DCTR_NATIVE_RENDERER_TESTS=ON
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          -DCMAKE_C_FLAGS=-m32
          -DCMAKE_EXE_LINKER_FLAGS=-m32

      - name: Build
        run: cmake --build build

      # Split in two so the log says which is which. The unlabelled subset never
      # creates a GL context, so it must run and must not skip anywhere; the
      # gpu-labelled subset runs under Xvfb with Mesa's software rasteriser and
      # reports 77 (a skip, not a failure) on a runner that cannot provide a
      # context. Turning the renderer tests on is therefore safe by construction:
      # the worst case is the same coverage as before, not a red build.
      - name: Test (headless)
        run: ctest --test-dir build --output-on-failure -LE gpu

      - name: Test (renderer, software GL)
        run: xvfb-run -a ctest --test-dir build --output-on-failure -L gpu

      # Static analysis. check-tidy.sh reports only findings on lines
      # this branch changed, using the checks enabled in .clang-tidy. It runs
      # after the test steps so it can never hide a test failure, and after the
      # build because clang-tidy needs the compile database and generated
      # headers.
      # TODO: remove continue-on-error once this has run green in CI. The local
      # result is clean, but it used clang-tidy 23 and this container's is older.
      - name: Static analysis
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          # check-tidy.sh defaults its base to the merge-base with
          # origin/turbocharged; the checkout is shallow and single-branch.
          git fetch --no-tags origin turbocharged
          ./check-tidy.sh --strict --build build

      - name: Package
        id: package
        shell: bash
        env:
          REF_NAME: ${{ github.head_ref || github.ref_name }}
        run: |
          version="${REF_NAME//\//-}-${GITHUB_SHA::7}"
          ./package-linux.sh "$version"
          archive="dist/ctr-turbocharged-${version}-linux-x86.tar.gz"
          appimage="dist/ctr-turbocharged-${version}-linux-x86.AppImage"
          runtime_source="dist/ctr-turbocharged-${version}-linux-x86.AppImage-runtime-source.tar.gz"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "appimage=$appimage" >> "$GITHUB_OUTPUT"
          echo "runtime_source=$runtime_source" >> "$GITHUB_OUTPUT"
          echo "- \`$(cat "$archive.sha256")\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`$(cat "$appimage.sha256")\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`$(cat "$runtime_source.sha256")\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Test AppImage launcher (without FUSE)
        shell: bash
        run: '"${{ steps.package.outputs.appimage }}" --appimage-extract-and-run --version'

      - name: Upload Linux tarball
        uses: actions/upload-artifact@v7
        with:
          name: linux-tarball
          path: ${{ steps.package.outputs.archive }}
          # Upload the tarball as-is: it keeps the executable bit, which zips drop.
          archive: false
          if-no-files-found: error

      - name: Upload Linux AppImage
        uses: actions/upload-artifact@v7
        with:
          name: linux-appimage
          path: ${{ steps.package.outputs.appimage }}
          archive: false
          if-no-files-found: error

      - name: Upload Linux checksums
        uses: actions/upload-artifact@v7
        with:
          name: linux-checksums
          path: |
            ${{ steps.package.outputs.archive }}.sha256
            ${{ steps.package.outputs.appimage }}.sha256
            ${{ steps.package.outputs.runtime_source }}.sha256
          if-no-files-found: error

      - name: Upload AppImage runtime source
        uses: actions/upload-artifact@v7
        with:
          name: linux-appimage-runtime-source
          path: ${{ steps.package.outputs.runtime_source }}
          archive: false
          if-no-files-found: error

  linux-armhf:
    name: Linux armhf (Raspberry Pi 5)
    runs-on: ubuntu-latest
    # Debian keeps every architecture in one archive, so the armhf build
    # dependencies install through multiarch next to the cross toolchain.
    # Bookworm is what Raspberry Pi OS is based on, so the binary runs against
    # the same glibc and Mesa it will meet on the Pi.
    container: debian:bookworm
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install cross toolchain and armhf SDL dependencies
        run: |
          dpkg --add-architecture armhf
          apt-get update
          apt-get install -y --no-install-recommends \
            git ca-certificates file cmake ninja-build pkg-config \
            crossbuild-essential-armhf qemu-user-static libwayland-bin \
            libx11-dev:armhf libxext-dev:armhf libxcursor-dev:armhf libxi-dev:armhf \
            libxrandr-dev:armhf libxfixes-dev:armhf libgl-dev:armhf libegl-dev:armhf \
            libasound2-dev:armhf libpulse-dev:armhf libpipewire-0.3-dev:armhf \
            libjack-jackd2-dev:armhf libudev-dev:armhf libdbus-1-dev:armhf \
            libibus-1.0-dev:armhf libusb-1.0-0-dev:armhf libwayland-dev:armhf \
            libxkbcommon-dev:armhf libdecor-0-dev:armhf libdrm-dev:armhf libgbm-dev:armhf

      - name: Checkout
        uses: actions/checkout@v6

      - name: Trust workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON
          -DCTR_NATIVE_RENDERER_TESTS=ON
          -DCMAKE_TOOLCHAIN_FILE=cmake/toolchain-linux-armhf.cmake
          -DCMAKE_CROSSCOMPILING_EMULATOR=qemu-arm-static

      - name: Build
        run: cmake --build build

      # The display-independent tests run under qemu-user. The gpu-labelled
      # subset needs a V3D context, which only real hardware can provide.
      - name: Test (headless, under qemu-arm)
        run: ctest --test-dir build --output-on-failure -LE gpu

      - name: Package
        id: package
        shell: bash
        env:
          REF_NAME: ${{ github.head_ref || github.ref_name }}
        run: |
          version="${REF_NAME//\//-}-${GITHUB_SHA::7}"
          ARCH=armhf ./package.sh linux "$version"
          archive="dist/ctr-turbocharged-${version}-linux-armhf.tar.gz"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "- \`$(cat "$archive.sha256")\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Linux armhf tarball
        uses: actions/upload-artifact@v7
        with:
          name: linux-armhf-tarball
          path: ${{ steps.package.outputs.archive }}
          archive: false
          if-no-files-found: error

      - name: Upload Linux armhf checksum
        uses: actions/upload-artifact@v7
        with:
          name: linux-armhf-checksums
          path: ${{ steps.package.outputs.archive }}.sha256
          if-no-files-found: error

  windows:
    name: Windows x86
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      # Keep LF endings so package.sh runs under MSYS2 bash.
      - name: Disable CRLF conversion
        shell: pwsh
        run: git config --global core.autocrlf false

      - name: Install MSYS2 MinGW32 toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW32
          update: true
          install: >-
            git
            zip
            mingw-w64-i686-gcc
            mingw-w64-i686-cmake
            mingw-w64-i686-ninja

      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure
        # CTR_NATIVE_RENDERER_TESTS stays off here on purpose. The Linux job
        # proves the renderer tests out on Mesa's software GL; there is no
        # equivalent verified path on the Windows runner, and enabling them
        # untested would trade a known gap for a flaky one. The 12 tests that
        # do run here are the same ones the Linux job runs under -LE gpu.
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Package
        id: package
        env:
          REF_NAME: ${{ github.head_ref || github.ref_name }}
        run: |
          version="${REF_NAME//\//-}-${GITHUB_SHA::7}"
          ./package.sh windows "$version"
          archive="dist/ctr-turbocharged-${version}-windows-x86.zip"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "- \`$(cat "$archive.sha256")\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.package.outputs.archive }}
          archive: false
          if-no-files-found: error
